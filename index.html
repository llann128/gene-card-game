<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>基因小博士：生物改造对决</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ========== 首页 ========== -->
  <div id="page-home" class="page active">
    <!-- 语言切换组件 -->
    <button class="lang-switch" id="langSwitch" onclick="toggleLang()">
      <span class="lang-icon">🌐</span><span id="langSwitchText">中文</span>
    </button>
    <div class="home-content">
      <div class="home-cover">
        <img src="images/cover.png" alt="基因小博士" onerror="this.style.display='none'">
      </div>
      <h1 class="home-title" data-i18n="home_title">基因小博士</h1>
      <p class="home-sub" data-i18n="home_sub">改造生物对决</p>
      <p class="home-desc" data-i18n-html="home_desc">帮助小动物们选择合适的基因<br>改造成超级生物</p>
      <button class="btn-start" data-i18n="btn_start" onclick="selectDifficulty()">开始游戏</button>
    </div>
  </div>

  <!-- ========== 难度选择（弹窗） ========== -->
  <div class="modal-overlay" id="modalDifficulty" onclick="closeModal('difficulty')">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h2 data-i18n="diff_title">选择对战难度</h2>
      <div class="diff-options">
        <div class="diff-opt easy" onclick="pickDifficulty('easy')">
          <span class="diff-emoji">🌱</span>
          <strong data-i18n="diff_easy">简单模式</strong>
        </div>
        <div class="diff-opt medium" onclick="pickDifficulty('medium')">
          <span class="diff-emoji">🔬</span>
          <strong data-i18n="diff_medium">中等模式</strong>
        </div>
        <div class="diff-opt hard" onclick="pickDifficulty('hard')">
          <span class="diff-emoji">⚡</span>
          <strong data-i18n="diff_hard">困难模式</strong>
        </div>
      </div>
      <p class="modal-hint" data-i18n="hint_close">点击空白处关闭</p>
    </div>
  </div>

  <!-- ========== 规则讲解（弹窗翻页，内容由 JS 生成） ========== -->
  <div class="modal-overlay" id="modalRules" onclick="closeModal('rules')">
    <div class="modal-box rules-box" onclick="event.stopPropagation()">
      <div class="rules-viewport" id="rulesViewport"></div>
      <button class="rules-arrow rules-prev" id="rulesPrev" onclick="slideRules(-1)">◀</button>
      <button class="rules-arrow rules-next" id="rulesNext" onclick="slideRules(1)">▶</button>
      <div class="rules-dots" id="rulesDots"></div>
    </div>
  </div>

  <!-- ========== 抽牌页 ========== -->
  <div id="page-draw" class="page">
    <div class="draw-header">
      <div class="draw-stage" id="drawStage">第 1 步：抽取生物载体卡</div>
      <div class="draw-count" id="drawCount">0 / 3</div>
    </div>
    <div class="draw-grid" id="drawGrid"></div>
    <!-- 手牌堆 -->
    <div class="draw-hand-pile" id="drawHandPile">
      <div class="dhp-title" data-i18n="draw_myhand">🃏 我的手牌</div>
      <div class="dhp-cards" id="dhpCards"></div>
    </div>
  </div>

  <!-- ========== 对战主界面（双人对打布局） ========== -->
  <div id="page-battle" class="page">
    <!-- 顶部信息栏 -->
    <div class="battle-topbar">
      <button class="top-icon" id="btnRulesTop" onclick="openRulesModal()">📖</button>
      <div class="top-round" id="topRound">第 1 / 3 局</div>
      <div class="top-score" id="topScore"></div>
      <button class="top-icon" id="btnHandbookTop" onclick="openHandbookModal()">📖</button>
    </div>

    <!-- AI 区域（上方） -->
    <div class="battle-ai-area" id="battleAiArea">
      <div class="ai-label">🤖 AI</div>
      <div class="ai-env-card" id="aiEnvCard"></div>
      <div class="ai-played-cards" id="aiPlayedCards"></div>
    </div>

    <!-- 中央对战区（环境卡） -->
    <div class="battle-center" id="battleCenter">
      <div class="env-zone" id="envZone">
        <div class="env-card-auto" id="envCardAuto">
          <span class="env-auto-label" data-i18n="env_current">当前环境</span>
        </div>
      </div>
    </div>

    <!-- 玩家区域（下方） -->
    <div class="battle-player-area" id="battlePlayerArea">
      <div class="player-label">🧑‍🔬 <span data-i18n="you_label">你</span></div>
      <!-- 三排手牌 -->
      <div class="player-hand-rows" id="playerHandRows">
        <div class="hand-row" id="handRowCreature">
          <div class="hand-row-label green">🧬 <span data-i18n="short_creature">生物</span></div>
          <div class="hand-row-cards" id="handRowCreatureCards"></div>
        </div>
        <div class="hand-row" id="handRowGene">
          <div class="hand-row-label purple">🔬 <span data-i18n="short_gene">基因</span></div>
          <div class="hand-row-cards" id="handRowGeneCards"></div>
        </div>
        <div class="hand-row" id="handRowSpecial">
          <div class="hand-row-label blue">⚡ <span data-i18n="short_special">特殊</span></div>
          <div class="hand-row-cards" id="handRowSpecialCards"></div>
        </div>
      </div>
      <!-- 操作区 -->
      <div class="player-action-bar">
        <div class="preview-row" id="previewRow"></div>
        <button class="btn-confirm" id="btnConfirm" data-i18n="btn_confirm" onclick="confirmBattle()">确认出战</button>
      </div>
    </div>

    <!-- 左下角：手牌查看 -->
    <button class="corner-btn corner-left" onclick="openHandModal()">🃏<span data-i18n="corner_hand">手牌</span></button>
    <!-- 右下角：弃牌堆 -->
    <button class="corner-btn corner-right" onclick="openDiscardModal()">🗑️<span id="discardBadge">0</span></button>
  </div>

  <!-- ========== 各种弹窗 ========== -->

  <!-- 小窗：游戏规则（对战中） -->
  <div class="modal-overlay" id="modalRulesMini" onclick="closeModal('rulesMini')">
    <div class="modal-box rules-mini-box" onclick="event.stopPropagation()">
      <div class="rules-viewport" id="rulesMiniViewport"></div>
      <button class="rules-arrow rules-prev" onclick="slideMiniRules(-1)">◀</button>
      <button class="rules-arrow rules-next" onclick="slideMiniRules(1)">▶</button>
      <div class="rules-dots" id="rulesMiniDots"></div>
      <p class="modal-hint" data-i18n="hint_close">点击空白处关闭</p>
    </div>
  </div>

  <!-- 小窗：图鉴 -->
  <div class="modal-overlay" id="modalHandbook" onclick="closeModal('handbook')">
    <div class="modal-box handbook-box" onclick="event.stopPropagation()">
      <div class="handbook-tabs">
        <button class="htab active" data-i18n="short_creature" onclick="switchHBTab('creature',this)">生物</button>
        <button class="htab" data-i18n="short_gene" onclick="switchHBTab('gene',this)">基因</button>
        <button class="htab" data-i18n="short_special" onclick="switchHBTab('special',this)">特殊</button>
        <button class="htab" data-i18n="short_env" onclick="switchHBTab('env',this)">环境</button>
      </div>
      <div class="handbook-grid" id="handbookGrid"></div>
      <p class="modal-hint" data-i18n="hint_close">点击空白处关闭</p>
    </div>
  </div>

  <!-- 小窗：手牌查看 -->
  <div class="modal-overlay" id="modalHand" onclick="closeModal('hand')">
    <div class="modal-box hand-box" onclick="event.stopPropagation()">
      <h3 data-i18n="hand_title">🃏 我的手牌</h3>
      <div id="modalHandContent"></div>
      <p class="modal-hint" data-i18n="hint_close">点击空白处关闭</p>
    </div>
  </div>

  <!-- 小窗：弃牌堆 -->
  <div class="modal-overlay" id="modalDiscard" onclick="closeModal('discard')">
    <div class="modal-box discard-box" onclick="event.stopPropagation()">
      <h3 data-i18n="discard_title">🗑️ 弃牌堆</h3>
      <div id="modalDiscardContent"></div>
      <p class="modal-hint" data-i18n="hint_close">点击空白处关闭</p>
    </div>
  </div>

  <!-- 小窗：亮牌结果 -->
  <div class="modal-overlay" id="modalReveal" onclick="event.stopPropagation()">
    <div class="modal-box reveal-box">
      <h2 data-i18n="reveal_title">⚔️ 双方亮牌</h2>
      <div class="reveal-dual">
        <div class="rv-side">
          <h4>🧑‍🔬 <span data-i18n="you_label">你</span></h4>
          <div id="rvPlayer"></div>
        </div>
        <div class="rv-vs">VS</div>
        <div class="rv-side">
          <h4>🤖 AI</h4>
          <div id="rvAI"></div>
        </div>
      </div>
      <button class="btn-start" id="btnGoCalc" data-i18n="btn_calc" onclick="goCalcScore()">开始算分 🧮</button>
    </div>
  </div>

  <!-- 小窗：本局结算 -->
  <div class="modal-overlay" id="modalRoundResult" onclick="nextAfterResult()">
    <div class="modal-box result-box" onclick="event.stopPropagation()">
      <div id="roundResultContent"></div>
      <button class="btn-start" id="btnAfterRound" data-i18n="btn_next" onclick="nextAfterResult()">进入下一局</button>
      <p class="modal-hint" data-i18n="hint_continue">点击空白处继续</p>
    </div>
  </div>

  <!-- 小窗：最终结果 -->
  <div class="modal-overlay" id="modalFinal" onclick="restartGame()">
    <div class="modal-box final-box" onclick="event.stopPropagation()">
      <div id="finalContent"></div>
      <div class="final-btns">
        <button class="btn-start" data-i18n="btn_restart" onclick="restartGame()">再来一局</button>
        <button class="btn-start secondary" data-i18n="btn_home" onclick="goHome()">返回首页</button>
      </div>
      <p class="modal-hint" data-i18n="hint_home">点击空白处返回首页</p>
    </div>
  </div>

  <!-- 小窗：确认跳过基因/特殊 -->
  <div class="modal-overlay" id="modalConfirmSkip" onclick="closeModal('ConfirmSkip')">
    <div class="modal-box confirm-box" onclick="event.stopPropagation()">
      <h3 id="confirmSkipTitle">提示</h3>
      <p id="confirmSkipMsg"></p>
      <div class="confirm-btns">
        <button class="btn-start secondary" data-i18n="btn_back" onclick="closeModal('ConfirmSkip')">返回修改</button>
        <button class="btn-start" id="btnSkipForce" data-i18n="btn_force" onclick="confirmBattleForce()">仍然确定</button>
      </div>
    </div>
  </div>

  <!-- 提示 Toast -->
  <div class="toast" id="toast"></div>

</div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
